version: 1

formatters:
  default:
    format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: default
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: default
    filename: logs/app.log
    encoding: utf-8

root:
  level: DEBUG
  handlers:
    - console
    - file