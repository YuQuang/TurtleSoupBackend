[project]
name = "turtlesoup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roy.Xu", email = "bbb233456@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "langchain>=1.3.16",
    "langchain-google-genai>=4.3.5",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.0",
    "gunicorn>=26.2.0",
    "uvicorn>=0.52.4",
    "uvicorn-worker>=0.4.0",
    "google-auth>=2.56.3",
    "google-auth-oauthlib>=1.4.1",
    "PyJWT>=2.10.1",
    "flask-cors>=6.0.5",
]

[project.scripts]
turtlesoup = "turtlesoup:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
